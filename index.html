<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Friend List</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  background:#020202;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}


/* =================================================
   MAIN FULL SCREEN BACKGROUND
================================================= */

.bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:-10;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255,215,0,.08),
      rgba(15,12,3,.75) 40%,
      #000 85%
    );
}


/* MOVING GOLD LIGHT */

.bgGlow{
  position:absolute;

  width:90vmax;
  height:90vmax;

  left:50%;
  top:50%;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,215,0,.12),
      rgba(255,180,0,.04) 30%,
      transparent 68%
    );

  filter:blur(30px);

  animation:
    mainGlow 9s ease-in-out infinite alternate;
}

@keyframes mainGlow{

  0%{
    transform:
      translate(-58%,-48%)
      scale(.82);

    opacity:.55;
  }

  50%{
    transform:
      translate(-43%,-55%)
      scale(1.12);

    opacity:.9;
  }

  100%{
    transform:
      translate(-50%,-42%)
      scale(.95);

    opacity:.65;
  }

}


/* SECOND LIGHT */

.bgLight{
  position:absolute;

  width:55vmax;
  height:55vmax;

  left:5%;
  top:55%;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,215,0,.07),
      transparent 65%
    );

  filter:blur(35px);

  animation:
    secondLight 11s ease-in-out infinite alternate;
}

@keyframes secondLight{

  from{
    transform:translate(0,20px);
  }

  to{
    transform:translate(45vw,-40px);
  }

}


/* MAIN PARTICLES */

.particle{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#ffd700;

  box-shadow:
    0 0 7px #ffd700,
    0 0 15px rgba(255,215,0,.5);

  animation:
    particleFloat 6s ease-in-out infinite;
}

@keyframes particleFloat{

  0%,100%{
    transform:
      translateY(35px)
      scale(.45);

    opacity:.08;
  }

  50%{
    transform:
      translateY(-75px)
      scale(1.4);

    opacity:.8;
  }

}

.p1{left:7%;top:18%;animation-delay:0s;}
.p2{left:16%;top:68%;animation-delay:1s;}
.p3{left:27%;top:37%;animation-delay:2s;}
.p4{left:39%;top:14%;animation-delay:3s;}
.p5{left:52%;top:78%;animation-delay:1.5s;}
.p6{left:64%;top:27%;animation-delay:2.5s;}
.p7{left:75%;top:63%;animation-delay:4s;}
.p8{left:87%;top:20%;animation-delay:3.5s;}
.p9{left:94%;top:48%;animation-delay:1.8s;}
.p10{left:47%;top:48%;animation-delay:4.5s;}


/* =================================================
   INTRO
================================================= */

#intro{
  position:fixed;
  inset:0;

  width:100%;
  height:100vh;
  height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-direction:column;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255,215,0,.12),
      rgba(8,7,3,.96) 52%,
      #000 100%
    );

  z-index:9999;
}

.introContent{
  position:relative;
  z-index:5;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;

  animation:
    introAppear 1.1s ease both;
}

@keyframes introAppear{

  from{
    opacity:0;
    transform:
      translateY(25px)
      scale(.96);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}

.smallText{
  margin-bottom:14px;

  color:rgba(255,255,255,.52);

  font-size:11px;
  font-weight:700;

  letter-spacing:6px;
}

.freeFire{
  color:#fff;

  font-size:52px;
  font-weight:1000;
  font-style:italic;

  letter-spacing:4px;

  line-height:1;

  text-shadow:
    0 0 5px rgba(255,215,0,.65),
    0 0 15px rgba(255,215,0,.3);

  animation:
    titleGlow 3s ease-in-out infinite alternate;
}

.freeFire span{
  color:#ffd400;
}

@keyframes titleGlow{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.025);
  }

}

.goldLine{
  width:90px;
  height:2px;

  margin-top:18px;
  margin-bottom:30px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #ffd700,
      transparent
    );

  box-shadow:
    0 0 8px rgba(255,215,0,.6);
}

.openBtn{
  position:relative;

  min-width:215px;

  padding:16px 30px;

  border:
    1px solid rgba(255,215,0,.8);

  border-radius:50px;

  color:#ffd700;

  background:
    linear-gradient(
      135deg,
      rgba(255,215,0,.1),
      rgba(255,255,255,.025)
    );

  backdrop-filter:blur(10px);

  font-size:16px;
  font-weight:900;

  letter-spacing:3px;

  cursor:pointer;

  box-shadow:
    0 0 18px rgba(255,215,0,.12);

  overflow:hidden;

  transition:.3s;
}

.openBtn::before{
  content:"";

  position:absolute;

  top:0;
  left:-120%;

  width:70%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.18),
      transparent
    );

  transform:skewX(-20deg);

  animation:
    buttonShine 4s ease-in-out infinite;
}

@keyframes buttonShine{

  0%,55%{
    left:-120%;
  }

  75%,100%{
    left:140%;
  }

}

.openBtn:hover{
  transform:
    translateY(-2px)
    scale(1.03);

  box-shadow:
    0 0 28px rgba(255,215,0,.25);
}

.openBtn:active{
  transform:scale(.97);
}

.bottomText{
  margin-top:22px;

  color:rgba(255,255,255,.3);

  font-size:9px;

  letter-spacing:3px;
}


/* =================================================
   MAIN
================================================= */

#main{
  display:none;

  position:relative;

  width:100%;
  min-height:100vh;

  max-width:520px;

  margin:auto;

  padding:35px 15px;
}


/* TITLE */

.title{
  text-align:center;

  margin:
    10px 0 35px;

  min-height:38px;

  color:#ffd400;

  font-size:31px;

  font-weight:900;

  font-style:italic;

  letter-spacing:2px;

  text-shadow:
    0 0 5px rgba(255,212,0,.6),
    0 0 14px rgba(255,212,0,.3);
}

#titleText{
  display:inline-block;

  transition:
    opacity .7s ease,
    transform .7s ease;
}


/* =================================================
   PLAYER BOXES
================================================= */

.friend{
  position:relative;

  overflow:hidden;

  margin:20px 0;

  padding:22px 20px;

  border:
    2px solid #ffd700;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      rgba(255,215,0,.08),
      rgba(255,215,0,.02)
    );

  cursor:pointer;

  animation:
    goldGlow 2s ease-in-out infinite;

  transition:
    transform .3s ease;
}

.friend::before{
  content:"";

  position:absolute;

  top:-50%;
  left:-50%;

  width:200%;
  height:200%;

  background:
    conic-gradient(
      from 0deg,
      transparent,
      rgba(255,215,0,.05),
      transparent,
      rgba(255,215,0,.05),
      transparent
    );

  animation:
    goldRotate 4s linear infinite;

  z-index:0;
}

.friend::after{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      135deg,
      transparent 30%,
      rgba(255,215,0,.04) 50%,
      transparent 70%
    );

  animation:
    goldShine 3s ease-in-out infinite;

  z-index:1;

  pointer-events:none;
}

.friend .name{
  position:relative;
  z-index:2;
}

@keyframes goldGlow{

  0%,100%{
    box-shadow:
      0 0 15px rgba(255,215,0,.15),
      inset 0 0 15px rgba(255,215,0,.05);

    border-color:#ffd700;
  }

  50%{
    box-shadow:
      0 0 30px rgba(255,215,0,.25),
      inset 0 0 25px rgba(255,215,0,.08);

    border-color:#ffed4a;
  }

}

@keyframes goldRotate{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

@keyframes goldShine{

  0%,100%{
    transform:translateX(-100%);
  }

  50%{
    transform:translateX(100%);
  }

}

.friend:hover{
  transform:scale(1.02);
}

.name{
  position:relative;

  font-size:23px;
  font-weight:900;

  color:#fff;

  letter-spacing:1px;
}


/* =================================================
   PLAYER VIEWER
================================================= */

#viewer{
  display:none;

  position:fixed;
  inset:0;

  overflow:hidden;

  background:#000;

  z-index:5000;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  padding:20px;
}


/* VIEWER ANIMATED BACKGROUND */

.viewerBG{
  position:absolute;

  inset:0;

  overflow:hidden;

  pointer-events:none;

  z-index:0;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255,215,0,.11),
      rgba(10,8,2,.88) 45%,
      #000 100%
    );
}


/* VIEWER MOVING GLOW */

.viewerGlow{
  position:absolute;

  width:100vmax;
  height:100vmax;

  left:50%;
  top:50%;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,215,0,.13),
      rgba(255,180,0,.04) 30%,
      transparent 68%
    );

  filter:blur(35px);

  animation:
    viewerGlowMove 7s ease-in-out infinite alternate;
}

@keyframes viewerGlowMove{

  0%{
    transform:
      translate(-58%,-48%)
      scale(.8);

    opacity:.5;
  }

  50%{
    transform:
      translate(-42%,-55%)
      scale(1.15);

    opacity:.9;
  }

  100%{
    transform:
      translate(-50%,-42%)
      scale(.95);

    opacity:.6;
  }

}


/* VIEWER PARTICLES */

.vParticle{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#ffd700;

  box-shadow:
    0 0 8px #ffd700,
    0 0 18px rgba(255,215,0,.5);

  animation:
    viewerParticle 5s ease-in-out infinite;
}

@keyframes viewerParticle{

  0%,100%{
    transform:
      translateY(40px)
      scale(.4);

    opacity:.1;
  }

  50%{
    transform:
      translateY(-80px)
      scale(1.5);

    opacity:.85;
  }

}

.vp1{left:8%;top:25%;animation-delay:0s;}
.vp2{left:20%;top:70%;animation-delay:1s;}
.vp3{left:34%;top:18%;animation-delay:2s;}
.vp4{left:48%;top:80%;animation-delay:3s;}
.vp5{left:63%;top:30%;animation-delay:1.5s;}
.vp6{left:76%;top:68%;animation-delay:2.5s;}
.vp7{left:88%;top:20%;animation-delay:3.5s;}
.vp8{left:94%;top:50%;animation-delay:4s;}


/* IMAGE */

#profileImage{
  position:relative;

  z-index:2;

  max-width:95%;
  max-height:72vh;

  object-fit:contain;

  border:
    2px solid #ffd400;

  border-radius:12px;

  box-shadow:
    0 0 12px rgba(255,212,0,.65),
    0 0 30px rgba(255,212,0,.2);

  animation:
    imageOpen .45s ease;
}

@keyframes imageOpen{

  from{
    opacity:0;
    transform:scale(.75);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}


/* UID + CLOSE */

.viewerBottom{
  position:relative;

  z-index:3;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:10px;

  width:100%;

  margin-top:14px;
}

#uidBox{
  margin:0;

  padding:12px 16px;

  border:
    2px solid #ffd400;

  border-radius:10px;

  color:#ffd400;

  font-weight:900;

  background:#090909;

  box-shadow:
    0 0 10px rgba(255,212,0,.3);

  cursor:pointer;

  text-align:center;

  white-space:nowrap;
}

.closeBtn{
  margin:0;

  padding:13px 18px;

  border:
    2px solid #ffd400;

  background:#111;

  color:#ffd400;

  font-weight:900;

  border-radius:10px;

  cursor:pointer;

  white-space:nowrap;
}


/* =================================================
   MOBILE
================================================= */

@media(max-width:500px){

  .freeFire{
    font-size:42px;
  }

}

@media(max-width:400px){

  .freeFire{
    font-size:35px;
  }

  .openBtn{
    min-width:195px;
    padding:15px 25px;
    font-size:14px;
  }

  .title{
    font-size:26px;
  }

  .name{
    font-size:20px;
  }

  .friend{
    padding:19px 16px;
  }

  .viewerBottom{
    gap:7px;
  }

  #uidBox{
    padding:11px 12px;
    font-size:13px;
  }

  .closeBtn{
    padding:12px 14px;
    font-size:13px;
  }

}
</style>
</head>

<body>


<!-- =================================
     MAIN BACKGROUND
================================= -->

<div class="bg">

  <div class="bgGlow"></div>
  <div class="bgLight"></div>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="particle p6"></div>
  <div class="particle p7"></div>
  <div class="particle p8"></div>
  <div class="particle p9"></div>
  <div class="particle p10"></div>

</div>


<!-- =================================
     INTRO
================================= -->

<div id="intro">

  <div class="introContent">

    <div class="smallText">
      FRIEND LIST
    </div>

    <div class="freeFire">
      FREE <span>FIRE</span>
    </div>

    <div class="goldLine"></div>

    <button
      class="openBtn"
      onclick="openSite()"
    >
      TAP TO OPEN
    </button>

    <div class="bottomText">
      ENTER YOUR FRIEND LIST
    </div>

  </div>

</div>


<!-- =================================
     MAIN
================================= -->

<div id="main">

  <div class="title">
    <span id="titleText">
      SELECT PLAYER
    </span>
  </div>


  <div
    class="friend"
    onclick="showPlayer('one')"
  >
    <div class="name">
      👑 TANZILA GULL
    </div>
  </div>


  <div
    class="friend"
    onclick="showPlayer('two')"
  >
    <div class="name">
      🔥 OLDVENΝΟΜ
    </div>
  </div>

</div>


<!-- =================================
     PLAYER VIEWER
================================= -->

<div id="viewer">

  <!-- ANIMATED VIEWER BACKGROUND -->

  <div class="viewerBG">

    <div class="viewerGlow"></div>

    <span class="vParticle vp1"></span>
    <span class="vParticle vp2"></span>
    <span class="vParticle vp3"></span>
    <span class="vParticle vp4"></span>
    <span class="vParticle vp5"></span>
    <span class="vParticle vp6"></span>
    <span class="vParticle vp7"></span>
    <span class="vParticle vp8"></span>

  </div>


  <img
    id="profileImage"
    src=""
    alt="Player"
  >


  <div class="viewerBottom">

    <div
      id="uidBox"
      onclick="copyUID()"
    >
      UID:
      <span id="uidText"></span>
    </div>


    <button
      class="closeBtn"
      onclick="closeImage()"
    >
      ✕ CLOSE
    </button>

  </div>

</div>


<script>

/* =================================
   PLAYER DATA
================================= */

const players={

  one:{
    image:
    "https://raw.githubusercontent.com/gullnoor596-svg/FFPost/refs/heads/main/file_0000000048e48211b2ef0ef2c1fd8306.png",

    uid:
    "7448596414"
  },

  two:{
    image:
    "https://raw.githubusercontent.com/gullnoor596-svg/FFPost/refs/heads/main/file_00000000d7a4821196a32ee40bfcf4ec.png",

    uid:
    "12043759712"
  }

};


/* OPEN MAIN */

function openSite(){

  document
    .getElementById("intro")
    .style.display="none";

  document
    .getElementById("main")
    .style.display="block";

}


/* SHOW PLAYER */

function showPlayer(player){

  const data=players[player];

  const image=
    document.getElementById("profileImage");

  const uid=
    document.getElementById("uidText");

  image.src=data.image;

  uid.textContent=data.uid;

  document
    .getElementById("viewer")
    .style.display="flex";

}


/* CLOSE PLAYER */

function closeImage(){

  document
    .getElementById("viewer")
    .style.display="none";

}


/* COPY UID */

function copyUID(){

  const uid=
    document
    .getElementById("uidText")
    .textContent;

  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard.writeText(uid);

  }

}


/* =================================
   AUTO TITLE
================================= */

const titles=[
  "SELECT PLAYER",
  "MY FRIEND LIST"
];

let titleIndex=0;

setInterval(()=>{

  const title=
    document.getElementById("titleText");

  title.style.opacity=".25";

  title.style.transform=
    "translateY(-5px)";

  setTimeout(()=>{

    titleIndex=
      (titleIndex+1)
      %titles.length;

    title.textContent=
      titles[titleIndex];

    title.style.opacity="1";

    title.style.transform=
      "translateY(0)";

  },350);

},3000);

</script>

</body>
</html>
